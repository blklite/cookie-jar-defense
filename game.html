<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie Jar Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: one 1080×1920 portrait column, scaled by --u. HUD 110 · yard 1440 · dock 370. 1em = 32 design px. */
:root {
  --u: .4;
  --night: #17142e;
  --ink: #221e45;
  --ink-2: #2f2a5c;
  --line: #4a4386;
  --sun: #ffd23f;
  --sun-deep: #c99a0c;
  --gum: #ff6fa8;
  --gum-deep: #b8406f;
  --cream: #fff8e7;
  --muted: #b8b2e6;
  --display: "Lilita One", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--night); color: var(--cream); font-family: var(--body);
  overflow: hidden; display: grid; place-items: center;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
#app {
  position: relative; font-size: calc(var(--u) * 32px);
  width: 33.75em; height: 60em; background: var(--ink);
  display: grid; grid-template-rows: 3.4375em 45em 11.5625em; overflow: clip;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: .12em solid var(--gum); outline-offset: .1em; }
.ic { width: 1.25em; height: 1.25em; flex: none; }

/* HUD */
.hud { display: flex; align-items: center; gap: .9em; padding-inline: 1em; background: var(--ink); border-bottom: .12em solid var(--line); }
.stat { display: flex; align-items: center; gap: .35em; font-family: var(--display); font-size: 1.6em; font-variant-numeric: tabular-nums; }
.stat .ic { width: 1.1em; height: 1.1em; }
.stat.wave { margin-left: auto; gap: .25em; }
.stat.wave span { color: var(--muted); font-size: .7em; }
.stat.hurt { animation: hurt .4s; }
@keyframes hurt { 30% { color: var(--gum); transform: scale(1.15); } }
.chips { display: flex; gap: .5em; }
.chip { font-family: var(--display); font-size: 1.15em; min-width: 3.2em; padding: .45em .7em; border-radius: .7em; background: var(--ink-2); box-shadow: 0 .18em 0 var(--line); }
.chip:active { transform: translateY(.12em); box-shadow: 0 .06em 0 var(--line); }

/* Yard */
.yard { position: relative; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.banner {
  position: absolute; left: 50%; top: 1.4em; transform: translate(-50%, -.6em); opacity: 0;
  width: max-content; max-width: 28em; padding: .7em 1.1em; border-radius: .9em;
  background: rgba(23, 20, 46, .92); border: .1em solid var(--line);
  font-size: 1.05em; line-height: 1.3; text-align: center; pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.banner b { font-family: var(--display); font-weight: 400; color: var(--sun); letter-spacing: .02em; }
.banner.show { opacity: 1; transform: translate(-50%, 0); }

/* Dock */
.dock { display: grid; grid-template-rows: 2.8em 1fr; gap: .45em; padding: .5em 1em .7em; background: var(--ink); border-top: .12em solid var(--line); min-height: 0; overflow: clip; }
.bar { display: flex; align-items: center; gap: 1em; min-width: 0; }
#tip { flex: 1; min-width: 0; font-size: 1em; line-height: 1.25; color: var(--muted); }
#tip b { color: var(--cream); }
.btn {
  font-family: var(--display); font-size: 1.15em; letter-spacing: .02em; padding: .55em 1em; border-radius: .8em;
  background: var(--sun); color: var(--ink); box-shadow: 0 .22em 0 var(--sun-deep); white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(.15em); box-shadow: 0 .07em 0 var(--sun-deep); }
.btn:disabled { background: var(--ink-2); color: var(--muted); box-shadow: 0 .22em 0 var(--line); cursor: default; }
.btn.alt { background: var(--gum); color: var(--night); box-shadow: 0 .22em 0 var(--gum-deep); }
.btn.ghost { background: var(--ink-2); color: var(--cream); box-shadow: 0 .22em 0 var(--line); }
#go.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }

.shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6em; min-height: 0; }
.card {
  display: grid; justify-items: center; align-content: center; gap: .1em; overflow: clip;
  padding: .3em .3em .4em; border-radius: 1em; background: var(--ink-2); box-shadow: 0 .2em 0 var(--line); text-align: center;
}
.card canvas { width: 2.8em; height: 2.8em; }
.card .nm { font-family: var(--display); font-size: 1.1em; line-height: 1.05; }
.card .role { font-size: .75em; line-height: 1.1; color: var(--muted); }
.card.sel .role { color: var(--ink); }
.card .cost { display: flex; align-items: center; gap: .25em; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .cost .ic { width: 1em; height: 1em; }
.card.sel { background: var(--sun); color: var(--ink); box-shadow: 0 .2em 0 var(--sun-deep); }
.card.poor { opacity: .45; }

.info { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr; gap: .45em 1.1em; min-height: 0; overflow: clip; }
.ihead { display: flex; align-items: center; gap: .6em; }
.ihead canvas { width: 2.5em; height: 2.5em; }
.ihead > div { flex: 1; }
.ihead h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.3em; line-height: 1; }
.ihead .chip { font-size: .95em; min-width: 0; padding: .4em .7em; }
.ihead p { margin: .15em 0 0; color: var(--muted); font-size: .9em; white-space: nowrap; }
.stats { grid-column: 1; display: grid; grid-template-columns: 1fr 1fr; gap: .25em .8em; margin: 0; align-content: start; }
.stats div { display: flex; justify-content: space-between; gap: .4em; font-size: .85em; border-bottom: .05em solid var(--line); padding-bottom: .12em; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats dd i { font-style: normal; color: var(--sun); }
.side { grid-column: 2; grid-row: 1 / span 2; display: grid; gap: .6em; align-content: center; }
.aim span { display: block; font-size: .85em; color: var(--muted); margin-bottom: .2em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--night); border-radius: .7em; padding: .15em; gap: .15em; }
.seg button { padding: .4em .1em; border-radius: .55em; font-size: .9em; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--ink-2); color: var(--cream); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; }
.acts .btn { font-size: 1em; padding: .4em .3em; line-height: 1.05; }
.acts .btn small { display: block; font-family: var(--body); font-weight: 700; font-size: .72em; }

/* Overlays */
.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 2em; background: rgba(23, 20, 46, .72); z-index: 5; }
.ov[hidden] { display: none; }
.panel {
  width: 100%; max-width: 26em; padding: 2em 2em 2.2em; border-radius: 1.6em; background: var(--ink);
  border: .12em solid var(--line); box-shadow: 0 .5em 0 rgba(0, 0, 0, .35); display: grid; gap: 1em;
}
.panel h1, .panel h2 { margin: 0; font-family: var(--display); font-weight: 400; line-height: .95; text-wrap: balance; }
.panel h1 { font-size: 4em; color: var(--sun); letter-spacing: .01em; }
.panel h1 em { font-style: normal; color: var(--gum); }
.panel h2 { font-size: 2.6em; color: var(--sun); }
.panel p { margin: 0; font-size: 1.15em; line-height: 1.4; }
.panel .how { margin: 0; padding: 0; list-style: none; display: grid; gap: .7em; font-size: 1.05em; line-height: 1.35; }
.panel .how li { display: grid; grid-template-columns: 1.6em 1fr; gap: .4em; }
.panel .how li::before { content: ""; width: .9em; height: .9em; margin-top: .25em; border-radius: 50%; background: var(--gum); }
.panel .how li:nth-child(2)::before { background: var(--sun); }
.panel .how li:nth-child(3)::before { background: #4cc9f0; }
.panel .row { display: flex; gap: .8em; flex-wrap: wrap; }
.panel .btn { font-size: 1.5em; padding: .55em 1.2em; }
.panel .small { font-size: .95em; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .banner { transition: none; }
  #go.pulse, .stat.hurt { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="stat" id="cookieStat" title="Cookies left in the jar">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#d4934a"/><circle cx="12" cy="12" r="10" fill="none" stroke="#a8692b" stroke-width="1.5"/><circle cx="8" cy="9" r="1.6" fill="#4a2a12"/><circle cx="14.5" cy="7.5" r="1.3" fill="#4a2a12"/><circle cx="15" cy="14" r="1.7" fill="#4a2a12"/><circle cx="9" cy="15.5" r="1.3" fill="#4a2a12"/></svg>
      <b id="cookies">20</b>
    </div>
    <div class="stat" title="Allowance coins">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd23f"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c99a0c" stroke-width="2"/><path d="M12 8.5v7" stroke="#c99a0c" stroke-width="2.2" stroke-linecap="round"/></svg>
      <b id="coins">180</b>
    </div>
    <div class="stat wave"><span>Wave</span><b id="wave">0</b><span id="waveOf">/ 30</span></div>
    <div class="chips">
      <button class="chip" id="speed" aria-label="Game speed">1×</button>
      <button class="chip" id="menu">Pause</button>
      <button class="chip" id="home" hidden>Home</button>
    </div>
  </header>

  <div class="yard">
    <canvas id="cv" aria-label="Backyard game board"></canvas>
    <div class="banner" id="banner" role="status"></div>
  </div>

  <footer class="dock">
    <div class="bar"><p id="tip"></p><button class="btn" id="go">Start wave 1</button></div>
    <div class="shop" id="shop"></div>
    <div class="info" id="info" hidden></div>
  </footer>

  <div class="ov" id="ov"><div class="panel" id="panel"></div></div>
</div>

<script>
(() => {
'use strict';
// ---------- Config ----------
const COLS = 9, ROWS = 12, CS = 120, W = COLS * CS, H = ROWS * CS;
const FROM_DISK = location.protocol === 'file:';   // opened from disk: show a Home button to the intro page
const HOME_URL = 'index.html', LAST_WAVE = 30;

const TOWERS = {
  nerf:    { name: 'Monster', role: 'Nerf blaster', cost: 50, air: true, tag: 'Fast darts. Hits kites.',
             mat: '#ff9f1c', shirt: '#2b7de9', skin: '#f1c27d', hair: '#ff6b1a',
             lv: [{ dmg: 6, rate: 2.5, range: 2.5 }, { cost: 60, dmg: 10, rate: 3, range: 2.6 }, { cost: 110, dmg: 16, rate: 4, range: 2.9 }] },
  balloon: { name: 'JoJo', role: 'Water balloons', cost: 80, air: false, tag: 'Soaks a whole group.',
             mat: '#4cc9f0', shirt: '#ff595e', skin: '#a0673b', hair: '#2a1a12',
             lv: [{ dmg: 14, rate: .8, range: 2.2, splash: .9 }, { cost: 100, dmg: 22, rate: .85, range: 2.3, splash: 1.1 }, { cost: 170, dmg: 36, rate: 1, range: 2.5, splash: 1.3 }] },
  bubble:  { name: 'Little Miss', role: 'Bubble wand', cost: 70, air: false, tag: 'Slows ninjas down.',
             mat: '#ff8fc7', shirt: '#7b2cbf', skin: '#ffdbac', hair: '#8a4b20',
             lv: [{ dmg: 2, rate: 1.2, range: 2, slow: .45, slowT: 1.6, multi: 1 }, { cost: 80, dmg: 3, rate: 1.3, range: 2.2, slow: .55, slowT: 2.2, multi: 2 }, { cost: 140, dmg: 4, rate: 1.4, range: 2.4, slow: .65, slowT: 2.8, multi: 3 }] },
  chicken: { name: 'Frankenstein', role: 'Rubber chicken', cost: 140, air: true, tag: 'Long range. Bonk stuns.',
             mat: '#ffd23f', shirt: '#06a77d', skin: '#c68642', hair: '#f7d154',
             lv: [{ dmg: 60, rate: .45, range: 4, stun: .4 }, { cost: 150, dmg: 100, rate: .45, range: 4.3, stun: .5 }, { cost: 240, dmg: 170, rate: .55, range: 4.6, stun: .7 }] },
};
const NINJAS = {
  sneaky: { name: 'Sneaky Ninja', short: 'Sneaky', tip: 'Tiptoes down the garden path. Mostly harmless.', hp: 22, spd: 1.1, bounty: 4, steal: 1, r: 30, band: '#e8443a' },
  speedy: { name: 'Scooter Ninja', short: 'Scooter', tip: 'Zooms past fast. Bubbles slow it down.', hp: 14, spd: 2, bounty: 4, steal: 1, r: 27, band: '#ffd23f' },
  sumo:   { name: 'Sumo Ninja', short: 'Sumo', tip: 'Big, slow and hard to budge. Bubbles only half work.', hp: 110, spd: .55, bounty: 11, steal: 3, r: 44, band: '#9b5de5', slowRes: .5 },
  smoke:  { name: 'Smoke Bomb Ninja', short: 'Smoke Bomb', tip: 'Vanishes in a puff and pops up further along.', hp: 40, spd: 1, bounty: 7, steal: 1, r: 30, band: '#8d99ae' },
  kite:   { name: 'Kite Ninja', short: 'Kite', tip: 'Flies straight over the yard. Only Monster and Frankenstein can reach it.', hp: 30, spd: .9, bounty: 6, steal: 1, r: 27, band: '#3a86ff', air: true },
  boss:   { name: 'Grand Sensei', short: 'Grand Sensei', tip: 'Enormous mustache. Splits into 4 ninjas when tagged.', hp: 600, spd: .42, bounty: 80, steal: 10, r: 56, band: '#f4a300', slowRes: .6, stunRes: .5 },
};
const QUIPS = {
  nerf: ['Ow!', 'No fair!', 'Right in the headband!'],
  balloon: ['Soggy!', 'My socks are wet!', 'Sploosh!'],
  bubble: ['So bubbly…', 'Pop!'],
  chicken: ['A CHICKEN?!', 'Bawk?!', 'Bonk!'],
  any: ["I'm telling Sensei!", 'Retreat!', 'Mommy!', 'Not the face!', 'Hai-y… ow.', 'I slipped!'],
};
const MODES = [['first', 'First'], ['strong', 'Strongest'], ['close', 'Closest']];

// Waves 1–10 are hand-made; later waves are built from a budget.
const EARLY = [
  [['sneaky', 8]],
  [['sneaky', 12]],
  [['sneaky', 8], ['speedy', 6]],
  [['sneaky', 10], ['speedy', 8]],
  [['sneaky', 8], ['kite', 5]],
  [['sneaky', 10], ['sumo', 3]],
  [['speedy', 14], ['sneaky', 6]],
  [['smoke', 8], ['sneaky', 8]],
  [['sumo', 4], ['kite', 8], ['speedy', 8]],
  [['sneaky', 10], ['boss', 1]],
];
const THREAT = { sneaky: 3, speedy: 3, smoke: 5, kite: 4, sumo: 10 };
const GAP = { sneaky: .7, speedy: .45, smoke: .9, kite: 1, sumo: 1.5, boss: 3 };
const hpMul = w => 1 + .16 * (w - 1) + .011 * (w - 1) ** 2;

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function waveGroups(w) {
  if (w <= EARLY.length) return EARLY[w - 1];
  const R = rng(w * 7919), pool = Object.keys(THREAT), budget = 24 + 7 * w, out = [];
  for (let i = 0; i < 3; i++) {
    const t = pool[Math.floor(R() * pool.length)];
    out.push([t, Math.max(2, Math.round(budget / 3 / THREAT[t]))]);
  }
  if (w % 10 === 0) out.push(['boss', w / 10]);
  return out;
}
function waveSchedule(w) {
  const list = []; let t = 0;
  for (const [type, n] of waveGroups(w)) {
    for (let i = 0; i < n; i++) { list.push({ type, at: t }); t += GAP[type]; }
    t += 1.8;
  }
  return list;
}
function waveSummary(w) {
  const m = {};
  for (const [t, n] of waveGroups(w)) m[t] = (m[t] || 0) + n;
  return Object.entries(m).map(([t, n]) => `${n} ${NINJAS[t].short}`).join(', ');
}

// ---------- Yard geometry ----------
const c2p = (c, r) => [c * CS + CS / 2, r * CS + CS / 2];
const GROUND = [[1, -1], [1, 2], [6, 2], [6, 5], [2, 5], [2, 8], [7, 8], [7, 10], [4, 10], [4, 11]];
const AIR = [[1, -1], [4, 11]];
function mkPath(cells) {
  const pts = cells.map(([c, r]) => c2p(c, r)), segs = []; let len = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], l = Math.hypot(x1 - x0, y1 - y0);
    segs.push({ x0, y0, x1, y1, l, s: len }); len += l;
  }
  return { pts, segs, len };
}
const PATHS = { ground: mkPath(GROUND), air: mkPath(AIR) };
function posAt(p, d) {
  for (const s of p.segs) if (d <= s.s + s.l) {
    const f = Math.max(0, (d - s.s) / s.l);
    return [s.x0 + (s.x1 - s.x0) * f, s.y0 + (s.y1 - s.y0) * f, Math.atan2(s.y1 - s.y0, s.x1 - s.x0)];
  }
  const s = p.segs[p.segs.length - 1]; return [s.x1, s.y1, Math.PI / 2];
}
const PATHCELLS = new Set();
for (let i = 1; i < GROUND.length; i++) {
  let [c, r] = GROUND[i - 1]; const [c1, r1] = GROUND[i], dc = Math.sign(c1 - c), dr = Math.sign(r1 - r);
  for (;;) { if (r >= 0) PATHCELLS.add(c + ',' + r); if (c === c1 && r === r1) break; c += dc; r += dr; }
}
const DECOR = { '8,0': 'tree', '0,4': 'tree', '8,5': 'pool', '0,10': 'sandbox' };
const buildable = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && !PATHCELLS.has(c + ',' + r) && !DECOR[c + ',' + r];
const towerAt = (c, r) => G.towers.find(t => t.c === c && t.r === r);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- State ----------
let G;
function newGame() {
  return { screen: 'title', state: 'build', coins: 160, cookies: 20, wave: 0, cleared: 0, speed: 1, endless: false, wonShown: false,
           t: 0, jarT: -9, towers: [], enemies: [], shots: [], fx: [], spawners: [], sel: null, build: null, nid: 1, seen: {}, tagged: 0 };
}
function best() { try { return +localStorage.getItem('cjd-best') || 0; } catch { return 0; } }
function saveBest() { try { if (G.cleared > best()) localStorage.setItem('cjd-best', String(G.cleared)); } catch {} }

function fx(kind, x, y, extra) { G.fx.push(Object.assign({ kind, x, y, t0: G.t, dur: kind === 'text' ? 1.1 : .5 }, extra)); }
function say(x, y, text, color, size) { fx('text', x, y, { text, color: color || '#fff8e7', size: size || 34 }); }

function spawn(type, w, d) {
  const N = NINJAS[type], hp = N.hp * hpMul(w);
  const e = { id: G.nid++, type, w, hp, max: hp, d: d || 0, x: 0, y: -60, dir: Math.PI / 2, walk: Math.random() * 100,
              slow: 0, slowUntil: 0, stunUntil: 0, vanishUntil: 0, nextVanish: G.t + 2 + Math.random(), hitT: -9 };
  [e.x, e.y, e.dir] = posAt(PATHS[N.air ? 'air' : 'ground'], e.d);
  G.enemies.push(e);
  if (!G.seen[type]) { G.seen[type] = 1; banner(`<b>New: ${N.name}</b><br>${N.tip}`, 5.5); }
}
function startWave() {
  if (G.state === 'over') return;
  const early = G.state === 'wave';
  G.wave++;
  G.spawners.push({ w: G.wave, t0: G.t, i: 0, list: waveSchedule(G.wave), done: false });
  if (early) { const b = 8 + G.wave; G.coins += b; say(W / 2, 120, `Brave! +${b} coins`, '#ffd23f', 40); }
  G.state = 'wave';
}
function speedOf(e) {
  const N = NINJAS[e.type];
  if (G.t < e.stunUntil) return 0;
  let v = N.spd * CS;
  if (G.t < e.slowUntil) v *= 1 - e.slow * (1 - (N.slowRes || 0));
  return v;
}
function hit(e, dmg, src) {
  if (e.gone) return;
  e.hp -= dmg; e.hitT = G.t;
  if (e.hp > 0) return;
  e.gone = true; G.tagged++;
  const N = NINJAS[e.type], b = Math.round(N.bounty * (1 + .02 * (e.w - 1)));
  G.coins += b;
  fx('poof', e.x, e.y - (N.air ? 50 : 0), { r: N.r });
  say(e.x, e.y - N.r - 20, '+' + b, '#ffd23f', 28);
  if (Math.random() < .35) say(e.x, e.y - N.r - 64, pick(Math.random() < .5 ? QUIPS[src] : QUIPS.any));
  if (e.type === 'boss') for (let i = 0; i < 4; i++) spawn('sneaky', e.w, Math.max(0, e.d - i * 26));
}

// ---------- Simulation ----------
function step(dt) {
  G.t += dt; const t = G.t;
  for (const sp of G.spawners)
    while (sp.i < sp.list.length && t - sp.t0 >= sp.list[sp.i].at) spawn(sp.list[sp.i++].type, sp.w, 0);

  for (const e of G.enemies) {
    const N = NINJAS[e.type], P = PATHS[N.air ? 'air' : 'ground'], v = speedOf(e);
    e.d += v * dt; e.walk += v * dt;
    if (e.type === 'smoke' && t >= e.nextVanish) {
      fx('poof', e.x, e.y, { r: N.r }); e.vanishUntil = t + .7; e.d += .9 * CS; e.nextVanish = t + 3;
    }
    [e.x, e.y, e.dir] = posAt(P, e.d);
    if (e.d >= P.len) {
      e.gone = true; G.cookies = Math.max(0, G.cookies - N.steal); G.jarT = t; flashCookies();
      say(e.x, e.y - 70, pick(['Nom!', 'Yoink!', 'Cookie!', 'Mine!']), '#ffd23f', 40);
    }
  }

  for (const tw of G.towers) {
    const D = TOWERS[tw.type], L = D.lv[tw.lvl - 1], range = L.range * CS, [tx, ty] = c2p(tw.c, tw.r);
    tw.cd -= dt;
    const tg = G.enemies.filter(e => !e.gone && e.y > 0 && t >= e.vanishUntil && (D.air || !NINJAS[e.type].air) &&
                                     Math.hypot(e.x - tx, e.y - ty) <= range + NINJAS[e.type].r * .5);
    if (!tg.length) { tw.cd = Math.max(tw.cd, 0); continue; }
    if (tw.mode === 'strong') tg.sort((a, b) => b.hp - a.hp);
    else if (tw.mode === 'close') tg.sort((a, b) => Math.hypot(a.x - tx, a.y - ty) - Math.hypot(b.x - tx, b.y - ty));
    else tg.sort((a, b) => b.d / PATHS[NINJAS[b.type].air ? 'air' : 'ground'].len - a.d / PATHS[NINJAS[a.type].air ? 'air' : 'ground'].len);
    const e0 = tg[0];
    tw.angle = Math.atan2(e0.y - ty, e0.x - tx);
    if (tw.cd > 0) continue;
    tw.cd = 1 / L.rate; tw.fireT = t;
    const sx = tx + Math.cos(tw.angle) * 34, sy = ty + 6 + Math.sin(tw.angle) * 26;
    if (tw.type === 'balloon') {
      const dur = Math.min(.6, Math.max(.3, Math.hypot(e0.x - sx, e0.y - sy) / 800));
      const [px, py] = posAt(PATHS.ground, e0.d + speedOf(e0) * dur);
      G.shots.push({ k: 'balloon', x: sx, y: sy, sx, sy, tx: px, ty: py, t0: t, dur, dmg: L.dmg, splash: L.splash * CS });
    } else if (tw.type === 'bubble') {
      for (const e of tg.slice(0, L.multi))
        G.shots.push({ k: 'bubble', x: sx, y: sy, id: e.id, lx: e.x, ly: e.y, spd: 750, dmg: L.dmg, slow: L.slow, slowT: L.slowT });
    } else {
      G.shots.push({ k: tw.type === 'nerf' ? 'dart' : 'chicken', x: sx, y: sy, id: e0.id, lx: e0.x, ly: e0.y,
                     spd: tw.type === 'nerf' ? 1400 : 950, dmg: L.dmg, stun: L.stun || 0, a: tw.angle });
    }
  }

  for (const s of G.shots) {
    if (s.k === 'balloon') {
      const p = (t - s.t0) / s.dur;
      s.x = s.sx + (s.tx - s.sx) * p; s.y = s.sy + (s.ty - s.sy) * p;
      if (p >= 1) {
        s.done = true; fx('splash', s.tx, s.ty, { r: s.splash, dur: .4 });
        for (const e of G.enemies.slice())
          if (!e.gone && !NINJAS[e.type].air && t >= e.vanishUntil && Math.hypot(e.x - s.tx, e.y - s.ty) <= s.splash + NINJAS[e.type].r * .4) hit(e, s.dmg, 'balloon');
      }
      continue;
    }
    const e = G.enemies.find(q => q.id === s.id && !q.gone);
    if (e) { s.lx = e.x; s.ly = e.y; }
    const dx = s.lx - s.x, dy = s.ly - s.y, dist = Math.hypot(dx, dy), mv = s.spd * dt;
    if (dist <= mv + 12) {
      s.done = true;
      if (!e || t < e.vanishUntil) continue;
      const N = NINJAS[e.type];
      if (s.k === 'bubble') {
        e.slow = t < e.slowUntil ? Math.max(e.slow, s.slow) : s.slow;
        e.slowUntil = Math.max(e.slowUntil, t + s.slowT);
        hit(e, s.dmg, 'bubble');
      } else if (s.k === 'chicken') {
        e.stunUntil = Math.max(e.stunUntil, t + s.stun * (1 - (N.stunRes || 0)));
        hit(e, s.dmg, 'chicken');
      } else hit(e, s.dmg, 'nerf');
    } else { s.x += dx / dist * mv; s.y += dy / dist * mv; s.a = Math.atan2(dy, dx); }
  }

  G.enemies = G.enemies.filter(e => !e.gone);
  G.shots = G.shots.filter(s => !s.done);
  G.fx = G.fx.filter(f => t - f.t0 < f.dur);

  for (const sp of G.spawners) {
    if (sp.done || sp.i < sp.list.length || G.enemies.some(e => e.w === sp.w)) continue;
    sp.done = true; G.cleared++;
    const b = 15 + 2 * sp.w; G.coins += b;
    banner(`<b>Wave ${sp.w} cleared!</b> +${b} coins`, 3);
  }
  G.spawners = G.spawners.filter(s => !s.done);

  if (G.cookies <= 0) { G.state = 'over'; G.screen = 'over'; G.sel = G.build = null; saveBest(); }
  else if (!G.spawners.length && G.state === 'wave') {
    G.state = 'build'; saveBest();
    if (G.cleared >= LAST_WAVE && !G.wonShown) { G.wonShown = true; G.screen = 'won'; }
  }
}

  text('go', goT);
  put($('go'), 'goOff', goOff, (el, v) => { el.disabled = v; });
  put($('go'), 'goPulse', G.state === 'build' && !goOff && G.towers.length > 0, (el, v) => el.classList.toggle('pulse', v));

  let tip;
  if (G.build) {
    const D = TOWERS[G.build];
    tip = G.coins >= D.cost ? `<b>${D.name}</b>, ${D.role.toLowerCase()}: ${D.tag} Tap the grass to place.` : `<b>${D.name}</b> costs ${D.cost}. You have ${G.coins}.`;
  } else if (G.sel) tip = 'Upgrade, sell, or change who this kid aims at.';
  else if (G.state === 'build') tip = G.wave === 0 ? 'Place a kid or two, then start the first wave.' : (atEnd ? 'All 30 waves done.' : `Next: <b>${waveSummary(G.wave + 1)}</b>`);
  else {
    const left = G.enemies.length + G.spawners.reduce((n, s) => n + s.list.length - s.i, 0);
    tip = `<b>${left}</b> ninja${left === 1 ? '' : 's'} still sneaking in.`;
  }
  html('tip', tip);

  const tw = G.towers.find(t => t.id === G.sel);
  put($('info'), 'infoHidden', !tw, (el, v) => { el.hidden = v; $('shop').hidden = !v; });
  if (tw) {
    const N = TOWERS[tw.type].lv[tw.lvl];
    put($('info'), 'infoKey', [tw.id, tw.lvl, tw.mode, N && G.coins >= N.cost, tw.spent].join(), el => { el.innerHTML = infoHTML(tw); drawIcons(); });
  } else {
    document.querySelectorAll('.card').forEach(c => {
      const k = c.dataset.type;
      put(c, 'sel' + k, G.build === k, (el, v) => el.classList.toggle('sel', v));
      put(c, 'poor' + k, G.coins < TOWERS[k].cost, (el, v) => el.classList.toggle('poor', v));
    });
  }
  put($('ov'), 'screen', G.screen || '', (el, v) => { el.hidden = !v; if (v) $('panel').innerHTML = overlayHTML(); });
}

// ---------- Input ----------
function tapCell(c, r) {
  const tw = towerAt(c, r);
  if (tw) { G.sel = G.sel === tw.id ? null : tw.id; G.build = null; return; }
  if (G.build) {
    if (!buildable(c, r)) { banner(PATHCELLS.has(c + ',' + r) ? 'The ninjas need the path. Put kids on the grass.' : 'Something is already there.', 2.2); return; }
    const D = TOWERS[G.build];
    if (G.coins < D.cost) { banner(`Need ${D.cost - G.coins} more coins for ${D.name}.`, 2.2); return; }
    G.coins -= D.cost;
    G.towers.push({ id: G.nid++, type: G.build, c, r, lvl: 1, cd: 0, angle: -Math.PI / 2, mode: 'first', spent: D.cost, fireT: -9 });
    const [x, y] = c2p(c, r); fx('place', x, y);
    G.build = null;   // one tap buys one kid; pick the card again to buy another
    return;
  }
  G.sel = null;
}
function cellOf(ev) {
  const b = cv.getBoundingClientRect();
  return { c: Math.floor((ev.clientX - b.left) / b.width * COLS), r: Math.floor((ev.clientY - b.top) / b.height * ROWS) };
}
cv.addEventListener('pointerdown', ev => { if (!G.screen) { const { c, r } = cellOf(ev); tapCell(c, r); } });
cv.addEventListener('pointermove', ev => { hover = ev.pointerType === 'mouse' ? cellOf(ev) : null; });
cv.addEventListener('pointerleave', () => { hover = null; });

$('shop').addEventListener('click', ev => {
  const card = ev.target.closest('.card'); if (!card || G.screen) return;
  const k = card.dataset.type; G.build = G.build === k ? null : k; G.sel = null;
});
$('info').addEventListener('click', ev => {
  const b = ev.target.closest('button'); const tw = G.towers.find(t => t.id === G.sel); if (!b || !tw) return;
  const [x, y] = c2p(tw.c, tw.r);
  if (b.dataset.act === 'mode') tw.mode = b.dataset.mode;
  else if (b.dataset.act === 'up') {
    const N = TOWERS[tw.type].lv[tw.lvl];
    if (N && G.coins >= N.cost) { G.coins -= N.cost; tw.spent += N.cost; tw.lvl++; fx('place', x, y); say(x, y - 60, 'Level ' + tw.lvl + '!', '#ffd23f', 34); }
  } else if (b.dataset.act === 'sell') {
    const refund = Math.floor(tw.spent * .7); G.coins += refund; say(x, y - 40, '+' + refund, '#ffd23f', 32);
    G.towers = G.towers.filter(t => t !== tw); G.sel = null;
  } else if (b.dataset.act === 'close') G.sel = null;
});
$('go').addEventListener('click', () => { if (!G.screen) startWave(); });
$('speed').addEventListener('click', () => { G.speed = G.speed === 1 ? 2 : 1; });
$('menu').addEventListener('click', () => { if (!G.screen) G.screen = 'pause'; });
$('home').addEventListener('click', goHome);
$('ov').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'play' || a === 'resume') G.screen = null;
  else if (a === 'endless') { G.endless = true; G.screen = null; }
  else if (a === 'home') goHome();
  else if (a === 'restart') {
    if (G.screen === 'pause' && Date.now() - restartArmed > 2500) { restartArmed = Date.now(); b.textContent = 'Tap again to restart'; return; }
    G = newGame(); G.screen = null; bg = null;
  }
});
document.addEventListener('contextmenu', ev => ev.preventDefault());

function goHome() { location.href = HOME_URL; }
if (FROM_DISK) {
  $('home').hidden = false;
}

// ---------- Sizing and loop ----------
function resize() {
  const gut = FROM_DISK ? 0 : 32, vpad = FROM_DISK ? 0 : 8;
  const u = Math.max(.2, Math.min((innerWidth - gut) / 1080, (innerHeight - vpad) / 1920));
  document.documentElement.style.setProperty('--u', u);
  const dpr = Math.min(2, devicePixelRatio || 1), bw = Math.round(W * u * dpr), bh = Math.round(H * u * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; K = bw / W; bg = null; }
  drawIcons();
}
addEventListener('resize', resize);

const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!G.screen) {
    acc += dt * G.speed;
    while (acc >= STEP && !G.screen) { step(STEP); acc -= STEP; }
  } else acc = 0;
  draw(); ui();
  requestAnimationFrame(frame);
}

function start(data) {
  G = data && data.G ? data.G : newGame();
  buildShop(); resize();
  if (document.fonts) document.fonts.ready.then(() => { drawIcons(); });
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ G }));
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
</body>
